name: "\U0001F41B Bug Report"
description: Report a bug in Klie
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Note:** This repo accepts issues only. Pull requests are not accepted.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
        - Android
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Klie version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: "A clear and concise description of what the bug is."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots (optional)
      description: Paste any relevant logs or screenshots here.
